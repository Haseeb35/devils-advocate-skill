name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Plugin and skill checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Repository checks
        run: python scripts/validate.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.330

      - name: claude plugin validate
        run: |
          claude plugin validate . --profile directory --strict
          claude plugin validate .claude-plugin/marketplace.json

      - name: Build Claude.ai zip
        run: ./scripts/build-zip.sh
