<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16110f"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#c2412d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c2412d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Left: title block -->
    <g transform="translate(88,0)">
      <rect x="0" y="118" width="8" height="8" rx="1" fill="#e2553d"/>
      <text x="20" y="127" fill="#e2553d" font-size="15" font-weight="600" letter-spacing="3">A SKILL FOR CLAUDE</text>
      <text x="-3" y="208" fill="#f4efe9" font-size="76" font-weight="700" letter-spacing="-2.5">Devil’s Advocate</text>
      <text x="0" y="256" fill="#a59c94" font-size="24" font-weight="400">Stress-test any plan before you commit to it.</text>
      <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#7d746d">
        <text x="0" y="318">code</text>
        <circle cx="52" cy="313" r="2" fill="#4a433e"/>
        <text x="64" y="318">business</text>
        <circle cx="152" cy="313" r="2" fill="#4a433e"/>
        <text x="164" y="318">life decisions</text>
      </g>
    </g>

    <!-- Right: verdict card -->
    <g transform="translate(800,62)" filter="url(#shadow)">
      <rect width="392" height="296" rx="14" fill="#1a1716" stroke="#2e2926"/>
      <circle cx="24" cy="24" r="5" fill="#3a3330"/>
      <circle cx="42" cy="24" r="5" fill="#3a3330"/>
      <circle cx="60" cy="24" r="5" fill="#3a3330"/>
      <line x1="0" y1="48" x2="392" y2="48" stroke="#2e2926"/>

      <text x="28" y="84" fill="#8a817a" font-size="12" font-weight="600" letter-spacing="1.6">THE CASE AGAINST</text>
      <rect x="28" y="96" width="320" height="7" rx="3.5" fill="#3a3330"/>
      <rect x="28" y="110" width="250" height="7" rx="3.5" fill="#3a3330"/>

      <text x="28" y="148" fill="#8a817a" font-size="12" font-weight="600" letter-spacing="1.6">3 WAYS THIS COULD FAIL</text>
      <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600">
        <rect x="28" y="160" width="40" height="18" rx="4" fill="#3b1d18"/>
        <text x="48" y="173" fill="#f07a63" text-anchor="middle">HIGH</text>
        <rect x="80" y="166" width="230" height="7" rx="3.5" fill="#3a3330"/>
        <rect x="28" y="186" width="40" height="18" rx="4" fill="#3a2c14"/>
        <text x="48" y="199" fill="#e6b450" text-anchor="middle">MED</text>
        <rect x="80" y="192" width="190" height="7" rx="3.5" fill="#3a3330"/>
        <rect x="28" y="212" width="40" height="18" rx="4" fill="#3a2c14"/>
        <text x="48" y="225" fill="#e6b450" text-anchor="middle">MED</text>
        <rect x="80" y="218" width="210" height="7" rx="3.5" fill="#3a3330"/>
      </g>

      <line x1="28" y1="248" x2="364" y2="248" stroke="#2e2926"/>
      <text x="28" y="276" fill="#8a817a" font-size="12" font-weight="600" letter-spacing="1.6">VERDICT</text>
      <rect x="112" y="259" width="168" height="26" rx="13" fill="#3a2c14" stroke="#5c4520"/>
      <text x="196" y="277" fill="#f0c25e" font-size="13.5" font-weight="600" text-anchor="middle">Go, with changes</text>
    </g>
  </g>
</svg>
